<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <title>Latvian Kraft</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(180deg, #0e1411, #1a231e);
      color: #e9efe9;
      line-height: 1.8;
      overflow-x: hidden;
      animation: fadeIn 2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Smoke drift */
    .smoke {
      position: fixed;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      background:
        radial-gradient(circle at 30% 40%, rgba(255,255,255,0.035), transparent 45%),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,0.03), transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(255,255,255,0.02), transparent 55%);
      animation: smokeDrift 80s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes smokeDrift {
      from { transform: translate(0, 0); }
      to { transform: translate(6%, -6%); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 70px 22px;
      text-align: center;
    }

    h1 {
      font-size: 3em;
      letter-spacing: 4px;
      margin-bottom: 10px;
      color: #d8efe0;
    }

    .subtitle {
      font-size: 0.95em;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9fc8b2;
      margin-bottom: 45px;
    }

    .lang-switch {
      margin-bottom: 55px;
    }

    .lang-switch button {
      background: none;
      border: 1px solid #4f7a63;
      color: #cfe6d8;
      padding: 7px 18px;
      margin: 0 6px;
      cursor: pointer;
      font-size: 0.95em;
      letter-spacing: 1.2px;
      transition: all 0.2s ease;
    }

    .lang-switch button.active {
      background-color: #4f7a63;
      color: #0e1411;
    }

    .lang-switch button:hover {
      border-color: #6fa88a;
    }

    .text {
      max-width: 820px;
      margin: 0 auto;
      text-align: left;
      font-size: 1.15em;
    }

    .text strong {
      color: #bfe5c8;
      font-weight: normal;
    }

    .divider {
      margin: 65px auto;
      width: 80px;
      border-top: 1px solid #4f7a63;
    }

    img {
      max-width: 100%;

      border-radius: 3px;
      opacity: 0.95;
    }

    .contacts {
      margin-top: 50px;
      font-size: 1em;
      color: #cfe6d8;
    }
